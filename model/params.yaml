# ScreenFixed valuation model parameters (all figures AUD, GST-inclusive prices)
# Every distribution: {dist: triangular, low, mode, high} | {dist: uniform, low, high} | {dist: fixed, value}
#
# CONFIDENCE KEY per input:
#   [CITED]    backed by a specific source (URL in comment)
#   [INFERRED] derived from cited data with a judgement step
#   [GUESS]    no source found — judgement only. Replace with real figures when available.

throughput:
  # [GUESS] Owner's own estimate (6-15/day). Note: screenfixed.com.au/about-us claims the
  # 3-city brand "repairs hundreds of devices every week"; if Brisbane alone did 100+/wk
  # that's 20+/day. Walk-in + mail-in + mobile service are commingled. Biggest unknown in the model.
  repairs_per_day: {dist: triangular, low: 6, mode: 10, high: 15}
  # [CITED] Store trades Mon-Fri 9-5 only, closed weekends & public holidays
  # (screenfixed.com.au/locations/brisbane). 52.1 wk x 5 d - ~11 QLD public holidays ~= 250.
  # The original back-of-envelope used ~300 days — that alone overstated revenue ~20%.
  trading_days_per_year: {dist: triangular, low: 244, mode: 250, high: 254}

ticket_mix:
  concentration: 60          # Dirichlet concentration; higher = tighter around the share modes
  tornado_tilt_category: premium_screen
  # Shares of job volume: [GUESS] — no published mix. Screens are the most common job
  # (gitnux: screens ~52% of global repair-market value); batteries second.
  # Prices: [CITED] from ScreenFixed's own published price list unless noted
  # (screenfixed.com.au/repairs/price-list-for-iphone-repairs and per-model pages).
  # parts_cost_pct: [GUESS] — one AU comp lists COGS ~33% of revenue (seekbusiness #683099).
  categories:
    budget_screen:            # iPhone 11-14 aftermarket $119-165, iPad 9 $149
      share: 0.40
      price: {dist: triangular, low: 119, mode: 149, high: 219}
      parts_cost_pct: {dist: triangular, low: 0.25, mode: 0.35, high: 0.45}
    premium_screen:           # original-refurb tiers $195-279, iPhone 17 $239-499, Z Fold 6 $899
      share: 0.18
      price: {dist: triangular, low: 195, mode: 279, high: 650}
      parts_cost_pct: {dist: triangular, low: 0.30, mode: 0.42, high: 0.55}
    tablet_screen:            # iPad 9th gen $149 cited; larger/newer iPads higher [INFERRED]
      share: 0.10
      price: {dist: triangular, low: 129, mode: 179, high: 320}
      parts_cost_pct: {dist: triangular, low: 0.25, mode: 0.35, high: 0.50}
    battery:                  # [CITED] iPhone batteries $99-139 across models
      share: 0.17
      price: {dist: triangular, low: 99, mode: 119, high: 139}
      parts_cost_pct: {dist: triangular, low: 0.20, mode: 0.30, high: 0.40}
    other_small:              # [CITED] port cleaning $45-55, charge-port repair $79-279
      share: 0.15
      price: {dist: triangular, low: 45, mode: 129, high: 279}
      parts_cost_pct: {dist: triangular, low: 0.10, mode: 0.20, high: 0.35}

costs:
  # [INFERRED->GUESS] Gross occupancy (rent incl. outgoings) for a 40-70sqm Level 1 tenancy
  # at 303 Adelaide St. Anchors: Level 1/458-460 George St listed at $250/sqm net (cited,
  # realcommercial); ground-floor CBD $530-1850/sqm gross (McGees); a suite in the subject
  # building was once marketed as "cheapest rent in CBD". Range synthesised by researcher.
  rent_annual: {dist: triangular, low: 16000, mode: 28000, high: 45000}
  # [GUESS] occupancy extras not captured in gross rent (utilities at meter, etc.)
  outgoings_annual: {dist: triangular, low: 1000, mode: 3000, high: 6000}
  # [GUESS] Non-owner labour. About-us names ~2 Brisbane techs; assumes owner works the
  # counter plus 1 FT tech (~$70-80K + super) and casual cover at the low end,
  # 2 FT equivalents at the high end.
  non_owner_wages_annual: {dist: triangular, low: 60000, mode: 95000, high: 150000}
  # [GUESS] insurance, merchant fees, software, marketing, utilities, accounting etc.
  other_opex_pct_revenue: {dist: triangular, low: 0.06, mode: 0.10, high: 0.14}

valuation:
  # [CITED range, judgement on shape] BizBuySell phone & computer repair (US, 2021-25):
  # median 1.54x SDE, avg 1.94x, upper quartile 2.40x. AU listings implied: LINK Sydney
  # 2-shop 1.73x, Wetherill Park 0.63x, North Lakes ~1.1x. AU generic small-biz guides:
  # 1.5-3x SDE. The original 2-3x assumption sits at/above the top of sector evidence.
  # Adversarial verification pass (direct re-fetch of the load-bearing comps) recommends
  # low 1.3 (Wetherill Park-style downside, key-person & lease risk), mode 2.0 (BizBuySell
  # average 1.94x + verified LINK Sydney comp at 1.73x), high 2.8 (US upper quartile 2.40x
  # + modest size premium, credible only with real management depth). See VALUATION.md.
  sde_multiple: {dist: triangular, low: 1.3, mode: 2.0, high: 2.8}

owner_check:
  stated_revenue_low: 1100000
  stated_revenue_high: 1200000

simulation:
  runs: 20000
  seed: 42
